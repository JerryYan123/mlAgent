# Strategy: board_replan — Experiment Board + per-round replanning
# Planner sketches a branch-grouped strategy board in round 1, then revises each round.
# Coding agent logs results to the board via log_to_board tool; planner reads board to replan.
competition_id: spooky-author-identification
working_dir: ./workspace
submission_file: submission.csv

jupyter:
  kernel_name: python3
  cell_timeout: 2400
  monitor_interval: 120
  gpu: "auto"
  max_cpu_cores: 8
  max_gpu_count: 1

planning_llm:
  model_name: gpt-5.4-mini
  api_key: ""
  temperature: 1.0
  max_tokens: 100000
  timeout: 600
  max_retries: 3
  keep_history: true

coding_llm:
  model_name: gpt-5.4-mini
  api_key: ""
  temperature: 1.0
  max_tokens: 100000
  timeout: 600
  max_retries: 3
  keep_history: true
  native_function_calling: true

planning_strategy: board_replan
replan_interval: 5
num_coding_agents: 1
max_rounds: 10
max_steps_per_round: 20
total_time_limit: 43200

trace_prompts: true
