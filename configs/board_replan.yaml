# Strategy: board_replan — Experiment Board + inner-loop replanning
# Planner maintains a persistent board of insights/experiments/hypotheses.
# Every replan_interval steps, coder pauses and planner re-engages with updated board.
competition_id: spooky-author-identification
working_dir: ./workspace
submission_file: submission.csv

jupyter:
  kernel_name: python3
  cell_timeout: 900
  monitor_interval: 120
  gpu: "auto"
  max_cpu_cores: 8
  max_gpu_count: 1

planning_llm:
  model_name: gpt-5.4-mini
  api_key: ""
  temperature: 1.0
  max_tokens: 100000
  timeout: 600
  max_retries: 3
  keep_history: true

coding_llm:
  model_name: gpt-5.4-mini
  api_key: ""
  temperature: 1.0
  max_tokens: 100000
  timeout: 600
  max_retries: 3
  keep_history: true
  native_function_calling: true

planning_strategy: board_replan
replan_interval: 5
num_coding_agents: 1
max_rounds: 10
max_steps_per_round: 20
total_time_limit: 14400

trace_prompts: true
